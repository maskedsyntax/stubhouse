name: Bearer Auth
description: Bearer auth header generated by compose layer.
method: GET
url: "{{base_url}}/api/secure/bearer"
query: []
headers:
  - [Accept, application/json]
auth:
  kind: bearer
  token: "{{auth_token}}"
body:
  kind: none
post_response_script: |
  test("Bearer accepted") { response.status == 200 }
