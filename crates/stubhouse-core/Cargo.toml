[package]
name = "stubhouse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "StubHouse core: HTTP request engine, mock runtime, config parser. No UI dependencies."

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
reqwest.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
base64 = "0.22"
serde_urlencoded = "0.7"
serde_yaml.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
http-body-util = "0.1"
rhai = { version = "1.21", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
wiremock = "0.6"
tempfile = "3"
